<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egg Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens (mirrors EggCameraUserUI/src/styles/tokens.css) ── */
    :root {
      --color-brand-700:  #05195A;
      --color-brand-600:  #06236F;
      --color-brand-500:  #5087C0;
      --color-brand-200:  #A3C4E6;
      --color-ink-400:    #717171;
      --font-ui: 'Hiragino Kaku Gothic Pro', 'ヒラギノ角ゴ Pro W6', 'Noto Sans JP', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-font-smoothing: antialiased; }

    body {
      height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #F2EDE8;
      font-family: var(--font-ui);
      padding: 32px 24px 36px;
      gap: 16px;
    }

    /* Eyebrow（ユーザーUIの .t-eyebrow 相当） */
    .logo {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--color-brand-600);
    }

    /* Heading（ユーザーUIの .t-heading 相当） */
    .heading {
      flex-shrink: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--color-brand-600);
    }

    /* Photo card（FinalPreview の写真枠に合わせて角丸4px） */
    .photo-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 480px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 4px;
    }

    /* Notice */
    .notice {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-brand-600);
      letter-spacing: 0.03em;
    }

    /* Primary button（ユーザーUIの .btn-primary と同じピル型） */
    .btn-download {
      flex-shrink: 0;
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: var(--color-brand-500);
      color: #fff;
      border: none;
      border-radius: 99px;
      font-family: var(--font-ui);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.25s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
    }
    .btn-download:active {
      background: var(--color-brand-600);
      transform: scale(0.97);
      box-shadow: 0 1px 6px rgba(81,143,204,0.15);
      transition: background 0.1s ease, transform 0.12s ease, box-shadow 0.1s ease;
    }
    .btn-download:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Hint */
    .hint {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 400;
      color: var(--color-ink-400);
      text-align: center;
      line-height: 1.6;
    }

    /* Error state */
    .error {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }
    .error .t-heading {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--color-brand-600);
    }
    .error .t-body {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-brand-600);
      line-height: 1.8;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-download:active { transform: none; }
    }
  </style>
</head>
<body>
  <p class="logo">EGG CAMERA</p>
  <p class="heading">お写真のダウンロード</p>

  <div id="photo-wrap" class="photo-wrap" style="display:none;">
    <img id="photo" alt="お写真">
  </div>

  <p id="notice" class="notice" style="display:none;">24時間以内にダウンロードしてください。</p>

  <button id="dl-btn" class="btn-download" style="display:none;">↓ 写真を保存する</button>

  <p id="hint" class="hint" style="display:none;">
    保存できない場合は、写真を長押し →「写真に追加」
  </p>

  <div id="error" class="error" style="display:none;">
    <p class="t-heading">お写真が見つかりませんでした</p>
    <p class="t-body">有効期限が切れているか、<br>URLが正しくない可能性があります。</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const id     = params.get('id');

    if (!id) {
      show('error');
    } else {
      const imgUrl = `/image/${id}.jpg`;
      const img    = document.getElementById('photo');

      img.onload = () => {
        show('photo-wrap');
        show('notice');
        show('dl-btn');
        show('hint');
      };
      img.onerror = () => show('error');
      img.src = imgUrl;

      document.getElementById('dl-btn').addEventListener('click', () => savePhoto(imgUrl, id));
    }

    function show(id) {
      document.getElementById(id).style.display = '';
    }

    async function savePhoto(imgUrl, id) {
      const btn = document.getElementById('dl-btn');
      btn.disabled    = true;
      btn.textContent = '準備中...';

      try {
        const res  = await fetch(imgUrl);
        const blob = await res.blob();
        const file = new File([blob], `photo_${id}.jpg`, { type: 'image/jpeg' });

        if (navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else {
          const url = URL.createObjectURL(blob);
          const a   = Object.assign(document.createElement('a'), {
            href: url, download: `photo_${id}.jpg`,
          });
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
      } catch (e) {
        // AbortError はキャンセルなので無視
      } finally {
        btn.disabled    = false;
        btn.textContent = '↓ 写真を保存する';
      }
    }
  </script>
</body>
</html>
