<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egg Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens (mirrors EggCameraUserUI/src/styles/tokens.css) ── */
    :root {
      --color-brand-700:  #05195A;
      --color-brand-600:  #06236F;
      --color-brand-500:  #5087C0;
      --color-brand-200:  #A3C4E6;
      --color-ink-400:    #717171;
      --font-ui: 'Hiragino Kaku Gothic Pro', 'ヒラギノ角ゴ Pro W6', 'Noto Sans JP', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-font-smoothing: antialiased; }

    body {
      height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #F2EDE8;
      font-family: var(--font-ui);
      padding: 32px 24px 36px;
      gap: 16px;
    }

    /* ブランドロゴ（Start画面の familiar + Egg Camera と同じ構成） */
    .brand {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .brand svg {
      width: 104px;
      height: auto;
      color: var(--color-brand-500);
    }
    .brand-name {
      font-family: 'Futura', 'Century Gothic', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.05;
      color: var(--color-brand-500);
    }

    /* Photo card（FinalPreview の写真枠に合わせて角丸4px） */
    .photo-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 480px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 4px;
    }

    /* Notice */
    .notice {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-brand-600);
      letter-spacing: 0.03em;
    }
    /* クレーム対応時の写真特定用ファイル名 */
    .filename {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--color-ink-400);
      word-break: break-all;
      text-align: center;
      max-width: 480px;
    }

    /* Primary button（ユーザーUIの .btn-primary と同じピル型） */
    .btn-download {
      flex-shrink: 0;
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: var(--color-brand-500);
      color: #fff;
      border: none;
      border-radius: 99px;
      font-family: var(--font-ui);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.25s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
    }
    .btn-download:active {
      background: var(--color-brand-600);
      transform: scale(0.97);
      box-shadow: 0 1px 6px rgba(81,143,204,0.15);
      transition: background 0.1s ease, transform 0.12s ease, box-shadow 0.1s ease;
    }
    .btn-download:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Hint */
    .hint {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 400;
      color: var(--color-ink-400);
      text-align: center;
      line-height: 1.6;
    }

    /* Error state */
    .error {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }
    .error .t-heading {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--color-brand-600);
    }
    .error .t-body {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-brand-600);
      line-height: 1.8;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-download:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="brand">
    <!-- familiar ロゴ（EggCameraUserUI/src/assets/familiar_logo.svg、fill は currentColor 化） -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 123.35 24.84" fill="currentColor" role="img" aria-label="familiar">
      <path fill-rule="evenodd" d="M8.28,24.52H2.48v-10.55H0v-4.36h2.48v-1.96c0-.56.02-.94.05-1.69.1-2.42,1.6-4.73,4.35-5.66C7.4.11,8.57.01,9.5.01h2.12v5.29h-.92c-.81,0-.96.02-1.19.11-.77.3-1.22.91-1.22,1.82,0,.46,0,.51,0,.75v1.63h3.34v4.36h-3.35v10.55Z"/>
      <rect x="63.97" y="9.61" width="5.28" height="14.91"/>
      <path fill-rule="evenodd" d="M63.22,3.39c0-1.87,1.52-3.39,3.39-3.39s3.39,1.52,3.39,3.39-1.52,3.39-3.39,3.39-3.39-1.52-3.39-3.39Z"/>
      <path fill-rule="evenodd" d="M81.76,3.39c0-1.87,1.52-3.39,3.39-3.39s3.39,1.52,3.39,3.39-1.52,3.39-3.39,3.39-3.39-1.52-3.39-3.39Z"/>
      <rect x="82.51" y="9.61" width="5.28" height="14.91"/>
      <path fill-rule="evenodd" d="M123.35,9.3h-1.32c-.44,0-.92.06-1.18.09-1.34.19-2.63,1.05-3.4,2.68v-2.45h-5.28v14.91h5.28v-4.33c0-.4,0-.68.03-1.22.09-2.12.92-3.46,2.88-4.22.55-.21,1.16-.28,2.14-.28.59,0,.33,0,.85,0v-5.17Z"/>
      <path fill-rule="evenodd" d="M49.99,11.89c-.88-1.56-2.42-2.59-4.98-2.59-2.17,0-3.81.79-4.92,2.35h-.06v-2.04h-5.28v14.91h5.28v-8.81c0-1.29,1.06-2.34,2.35-2.34s2.34,1.05,2.34,2.34v1.67s0,7.14,0,7.14h5.28v-8.81c0-1.29,1.05-2.34,2.35-2.34s2.34,1.05,2.34,2.34v1.69s0,7.12,0,7.12h5.28v-8.21s0-.31,0-.79c0-.7-.04-1.23-.07-1.63-.26-2.91-2.39-4.59-5.06-4.59-2.17,0-3.94,1.06-4.86,2.59Z"/>
      <rect x="73.25" y=".35" width="5.28" height="24.17"/>
      <path fill-rule="evenodd" d="M25.47,9.62h5.28v14.9h-5.28v-1.32c-1.32,1.03-2.97,1.64-4.77,1.64-4.29,0-7.77-3.48-7.77-7.77s3.48-7.77,7.77-7.77c1.8,0,3.45.61,4.77,1.64v-1.32ZM18.41,17.07c0-1.99,1.62-3.61,3.61-3.61s3.61,1.62,3.61,3.61-1.62,3.61-3.61,3.61-3.61-1.62-3.61-3.61Z"/>
      <path fill-rule="evenodd" d="M102.9,9.62h5.28v14.9h-5.28v-1.32c-1.32,1.03-2.97,1.64-4.77,1.64-4.29,0-7.77-3.48-7.77-7.77s3.48-7.77,7.77-7.77c1.8,0,3.45.61,4.77,1.64v-1.32ZM95.84,17.07c0-1.99,1.62-3.61,3.61-3.61s3.61,1.62,3.61,3.61-1.62,3.61-3.61,3.61-3.61-1.62-3.61-3.61Z"/>
    </svg>
    <p class="brand-name">Egg Camera</p>
  </div>

  <div id="photo-wrap" class="photo-wrap" style="display:none;">
    <img id="photo" alt="お写真">
  </div>

  <p id="notice" class="notice" style="display:none;">24時間以内にダウンロードしてください。</p>

  <!-- クレーム対応時にどの写真か特定できるようファイル名を表示 -->
  <p id="filename" class="filename" style="display:none;"></p>

  <button id="dl-btn" class="btn-download" style="display:none;">↓ 写真を保存する</button>

  <p id="hint" class="hint" style="display:none;">
    保存できない場合は、写真を長押し →「写真に追加」
  </p>

  <!-- まだアップロードされていない（電波不安定での後追い中）場合の案内 -->
  <div id="pending" class="error" style="display:none;">
    <p class="t-heading">写真を準備しています</p>
    <p class="t-body">通信状況により、表示まで時間がかかることがあります。<br>時間をおいてから、もう一度このページを開いてダウンロードしてください。</p>
    <button id="retry-btn" class="btn-download" style="margin-top:8px;">再読み込み</button>
  </div>

  <div id="error" class="error" style="display:none;">
    <p class="t-heading">お写真が見つかりませんでした</p>
    <p class="t-body">URLが正しくない可能性があります。</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const id     = 'familia_EggCamera_2026.06.13.01.41.46'; // プロト用ダミー

    // 画像が読めない＝未アップロード（後追い中）か期限切れ。何度か再試行してから案内を出す。
    const RETRY_DELAYS_MS = [4000, 8000, 15000]; // ページ滞在中の自動再試行
    let retryIndex = 0;

    if (!id) {
      show('error');
    } else {
      loadPhoto();
      document.getElementById('retry-btn').addEventListener('click', () => location.reload());
    }

    function loadPhoto() {
      const imgUrl = 'proto-composed.jpg'; // baby_b にフレーム合成した完成画像（相対パス＝サブパス配下でも解決）
      const img    = document.getElementById('photo');
      img.onload = () => {
        hide('pending');
        show('photo-wrap');
        show('notice');
        const fn = document.getElementById('filename');
        fn.textContent = `ファイル名: ${id}.jpg`;
        show('filename');
        show('dl-btn');
        show('hint');
        document.getElementById('dl-btn').onclick = () => savePhoto(imgUrl, id);
      };
      img.onerror = () => {
        if (retryIndex < RETRY_DELAYS_MS.length) {
          // 自動で少し待って再試行（後追いアップロードの完了を待つ）
          show('pending');
          setTimeout(() => { img.src = `${imgUrl}?t=${Date.now()}`; }, RETRY_DELAYS_MS[retryIndex++]);
        } else {
          // 一定回数試しても来なければ「時間をおいて」案内のまま据え置き
          show('pending');
        }
      };
      img.src = imgUrl;
    }

    function show(id) { document.getElementById(id).style.display = ''; }
    function hide(id) { document.getElementById(id).style.display = 'none'; }

    async function savePhoto(imgUrl, id) {
      const btn = document.getElementById('dl-btn');
      btn.disabled    = true;
      btn.textContent = '準備中...';

      try {
        const res  = await fetch(imgUrl);
        if (!res.ok) throw new Error('not ready');
        const blob = await res.blob();
        const saveName = `${id}.jpg`; // id は familia_EggCamera_日時。そのまま保存名に使う
        const file = new File([blob], saveName, { type: 'image/jpeg' });

        if (navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else {
          const url = URL.createObjectURL(blob);
          const a   = Object.assign(document.createElement('a'), {
            href: url, download: saveName,
          });
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
      } catch (e) {
        // 保存時にまだ来ていなければ「時間をおいて」案内へ（AbortErrorはキャンセルなので無視）
        if (e && e.name !== 'AbortError' && String(e.message).includes('not ready')) {
          hide('photo-wrap'); hide('notice'); hide('dl-btn'); hide('hint');
          show('pending');
        }
      } finally {
        btn.disabled    = false;
        btn.textContent = '↓ 写真を保存する';
      }
    }
  </script>
</body>
</html>
